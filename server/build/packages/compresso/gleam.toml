name = "compresso"
version = "0.1.0"
target = "erlang"

description = "WIP: Compression package with Gzip, Deflate/Inflate & Brotli support using zlib."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
exception = ">= 2.1.0 and < 3.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
