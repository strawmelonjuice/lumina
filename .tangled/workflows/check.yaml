when:
  - event: ["push", "manual"]
    branch: ["develop"]
  - event: ["pull_request"]
    branch: ["main"] # We have no main, yet.

engine: "nixery"

# using the default values
clone:
  skip: false
  depth: 1
  submodules: false

dependencies:
  nixpkgs/nixpkgs-unstable:
    # I wish I could just use the flake, but alas aargh
    - mise

#environment:
#  MY_ENV_VAR: "MY_ENV_VALUE"

steps:
  - name: "Run tests through Mise"
    # I don't think this'll work, we have no database to reflect from!
    command: "mise i && mise run check"
    environment:
      GOOS: "darwin"
      GOARCH: "arm64"
